<!DOCTYPE html>
<html>
<body>

<h1>HTML Buttons</h1>

<p>Ejemplo de un botón HTML habilitado.</p>

<button>boton para presionar</button>

<p>Ejemplo de un botón HTML deshabilitado:</p>
<button disabled>Estoy deshabilitado</button>

</body>
</html>

<head>
<style>
.testbtn {
  background-color: #04AA6D;
  color: white;
  font-size: 15px;
  padding: 12px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.testbtn:hover {
  background-color: #059862;
}
</style>
</head>
<body>

<p>Ejemplo de un botón con estilo:</p>
<button class="testbtn">Me siento muy verde</button>

</body>
</html>

<html>
<body>

<p>Ejemplo de un botón con acción JavaScript:</p>

<button onclick="alert('aceituna')">Click Me</button>

</body>
</html>
